name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Show interpreter
        run: python -c "import sys; print(sys.version)"
      - name: Install CPU torch pairing and project extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          python -m pip install -c configs/cpu-constraints.txt ".[preprocess,listen,dev]"
      - name: Record torch build and device
        run: python -c "import torch, sys; print('torch', torch.__version__); print('cuda_available', torch.cuda.is_available()); print('device', 'cpu')"
      - name: Public hygiene rules over tracked files
        run: python -B tools/check_hygiene.py --tracked
      - name: Full test suite
        run: python -B -m pytest -q -p no:cacheprovider --junitxml=pytest-results.xml
      - name: Complete synthetic smoke pipeline
        run: python -B -m easykws.smoke --output "${{ github.workspace }}-smoke-${{ matrix.os }}-${{ matrix.python-version }}"
      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: warn

  packaging:
    name: build, install, history scan and artifact review
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tool
        run: python -m pip install build
      - name: Public hygiene rules over tracked files
        run: python -B tools/check_hygiene.py --tracked
      - name: Public hygiene rules over all reachable history
        run: python -B tools/check_history.py --root .
      - name: Build sdist and wheel from the committed tree
        run: python -m build --outdir dist
      - name: Review artifact members, metadata and content
        run: python -B tools/check_release_artifacts.py dist/*.tar.gz dist/*.whl
      - name: Install the wheel into a clean venv and run black-box tests
        run: |
          python -m venv wheelenv
          wheelenv/bin/python -m pip install --upgrade pip
          wheelenv/bin/python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "expected exactly one built wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          wheelenv/bin/python -m pip install -c configs/cpu-constraints.txt "${wheels[0]}[preprocess,listen,dev]"
          wheelenv/bin/python -m pip check
          wheelenv/bin/python -c "import easykws; assert 'site-packages' in easykws.__file__, easykws.__file__"
          mkdir installed-tests && cp tests/installation/test_installed_package.py installed-tests/
          env -u PYTHONPATH -u PYTHONHOME wheelenv/bin/python -B -m pytest -q -p no:cacheprovider installed-tests --junitxml=installed-results.xml
          python -B -c "import xml.etree.ElementTree as ET; s = ET.parse('installed-results.xml').getroot()[0]; assert s.get('skipped') == '0' and s.get('failures') == '0' and s.get('errors') == '0', 'installed tests must not skip, fail or error'"
      - name: Rebuild the wheel from the sdist and smoke-test it
        run: |
          mkdir sdist-check && tar -xzf dist/*.tar.gz -C sdist-check
          ls sdist-check/easykws-0.1.0/configs/cpu-constraints.txt sdist-check/easykws-0.1.0/docs/install.md > /dev/null
          python -m venv sdistenv
          sdistenv/bin/python -m pip install --upgrade pip build
          sdistenv/bin/python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          (cd sdist-check/easykws-0.1.0 && ../../sdistenv/bin/python -m build --wheel --outdir ../rebuilt .)
          # The project's base dependencies are empty; the smoke pipeline needs
          # the preprocess extra explicitly. Pick exactly one rebuilt wheel.
          shopt -s nullglob
          wheels=(sdist-check/rebuilt/*.whl)
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "expected exactly one rebuilt wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          sdistenv/bin/python -m pip install -c configs/cpu-constraints.txt "${wheels[0]}[preprocess]"
          sdistenv/bin/python -m pip check
          env -u PYTHONPATH -u PYTHONHOME sdistenv/bin/python -B -m easykws.smoke --output "${{ github.workspace }}-sdist-smoke"
      - name: Upload reviewed source distributions only
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
      - name: Upload installed-test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-tests
          path: installed-results.xml
          if-no-files-found: warn
